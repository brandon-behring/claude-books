name: research-integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '*/sources/manifest.yaml'
      - 'research-lock.json'
      - 'research-integrity/**'
      - 'scripts/research_integrity.py'
      - 'scripts/generate-research-integrity.py'
      - 'scripts/validate-research-integrity.py'
      - 'tests/research_integrity/**'
      - 'package.json'
      - '.github/workflows/research-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '*/sources/manifest.yaml'
      - 'research-lock.json'
      - 'research-integrity/**'
      - 'scripts/research_integrity.py'
      - 'scripts/generate-research-integrity.py'
      - 'scripts/validate-research-integrity.py'
      - 'tests/research_integrity/**'
      - 'package.json'
      - '.github/workflows/research-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate pinned research integrity state
        run: npm run research:validate
      - name: Run research integrity mutation tests
        run: npm run research:test
